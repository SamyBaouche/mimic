<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LedgerLite</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; font-weight: 600; }
    main { display: flex; gap: 24px; padding: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px #0002; }
    form { width: 340px; }
    label { display: block; font-size: 13px; margin-top: 12px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 6px; cursor: pointer; }
    .primary { background: #2563eb; color: #fff; }
    .success { background: #16a34a; color: #fff; }
    table { border-collapse: collapse; min-width: 480px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    #cookie-banner { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                     display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    #cookie-banner .dialog { background: #fff; padding: 20px 28px; margin-bottom: 40px;
                             border-radius: 10px; max-width: 520px; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <header>LedgerLite · Accounts Payable</header>
  <main>
    {% block form %}{% endblock %}
    <section class="card">
      <h3>Recorded invoices ({{ entries|length }})</h3>
      <table>
        <tr><th>Vendor</th><th>Invoice #</th><th>Date</th><th>Total</th><th>Category</th></tr>
        {% for e in entries %}
        <tr><td>{{ e.vendor }}</td><td>{{ e.invoice_number }}</td><td>{{ e.date }}</td>
            <td>{{ "%.2f"|format(e.total) }}</td><td>{{ e.category }}</td></tr>
        {% endfor %}
      </table>
    </section>
  </main>
  {% if chaos %}
  <script>
    // Chaos mode: everyday web flakiness (see sandbox/app.py).
    const C = {{ chaos|tojson }};
    if (C.relabel) document.querySelectorAll('label').forEach(l => l.textContent += ' *');
    const submit = document.querySelector('form [type=submit]');
    if (C.slow_submit_ms && submit) {
      submit.disabled = true;
      setTimeout(() => submit.disabled = false, C.slow_submit_ms);
    }
    if (C.slow_field) {
      const f = document.querySelector(`[name="${C.slow_field}"]`);
      if (f) { f.disabled = true; setTimeout(() => f.disabled = false, C.slow_field_ms); }
    }
    if (C.overlay) {
      const b = document.createElement('div');
      b.id = 'cookie-banner';
      b.innerHTML = `<div class="dialog"><b>We value your privacy</b>
        <p>We use cookies to improve your experience.</p>
        <button id="cookie-accept" class="primary" type="button">Accept all</button>
        <button id="cookie-manage" type="button">Manage</button></div>`;
      document.body.appendChild(b);
      b.querySelector('#cookie-accept').onclick = () => b.remove();
      if (C.overlay_escape) {
        document.addEventListener('keydown', e => { if (e.key === 'Escape') b.remove(); });
      }
    }
  </script>
  {% endif %}
</body>
</html>
