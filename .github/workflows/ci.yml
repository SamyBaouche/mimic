name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    # SQLite storage, the sandbox, the Django admin, Excel/CSV: everything but Postgres.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: OpenMP for XGBoost (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -rs

  postgres:
    # The same storage tests against Postgres + pgvector.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mimic
          POSTGRES_PASSWORD: mimic
          POSTGRES_DB: mimic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimic"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mimic:mimic@localhost:5432/mimic
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q -rs tests/test_store.py tests/test_healing.py
