[project]
name = "mimic-agent"
version = "1.0.0"
description = "A local AI agent that learns a web task from one demonstration, repeats it, and repairs itself when the interface changes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samy Baouche" }]
requires-python = ">=3.11"
keywords = ["agent", "automation", "computer-use", "playwright", "ollama", "rpa", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "playwright>=1.47",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "reportlab>=4.0",
    "pypdfium2>=4.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
]
matcher = [
    "torch>=2.2",
    "transformers>=4.40",
]
mlflow = [
    "mlflow>=2.16",
]
all = ["mimic-agent[postgres,ml,matcher,mlflow]"]
# kept so `uv sync --extra agent` from older instructions still works
agent = []

[project.scripts]
mimic = "mimic.cli:main"

[project.urls]
Homepage = "https://github.com/SamyBaouche/mimic"
Changelog = "https://github.com/SamyBaouche/mimic/blob/main/CHANGELOG.md"
Issues = "https://github.com/SamyBaouche/mimic/issues"
Model = "https://huggingface.co/SamyBaouche/mimic-element-matcher"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mimic-agent[postgres,ml,mlflow]",
    "django>=5.0",  # a real app Mimic was not built for (tests/realapps)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimic"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:mlflow.*"]  # MLflow's own SQLAlchemy notices

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
