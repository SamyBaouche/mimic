<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ app_title }} · WorkSuite</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 14px 24px; font-weight: 600; }
    main { display: flex; gap: 24px; padding: 24px; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 3px #0002; }
    form { width: 340px; }
    label { display: block; font-size: 13px; margin-top: 12px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 6px; cursor: pointer; }
    .primary { background: #2563eb; color: #fff; }
    .success { background: #16a34a; color: #fff; }
    table { border-collapse: collapse; min-width: 480px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    #cookie-banner { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                     display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
    #cookie-banner .dialog { background: #fff; padding: 20px 28px; margin-bottom: 40px;
                             border-radius: 10px; max-width: 520px; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
  <style>
    fieldset { border: 0; padding: 0; margin: 12px 0 0; }
    legend { font-size: 13px; padding: 0; }
    .choice { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; }
    .choice input { width: auto; margin: 0; }
    dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 14px; }
    dt { color: #666; }
    .notice { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 12px 16px;
              border-radius: 6px; }
    .mail td { padding: 8px 10px; }
    .mail a { color: #1f3a5f; text-decoration: none; }
    pre.body { white-space: pre-wrap; font: 14px/1.5 system-ui, sans-serif; margin: 12px 0; }
    textarea { width: 100%; min-height: 120px; padding: 8px; margin-top: 4px; box-sizing: border-box; font: inherit; }
  </style>
</head>
<body>
  <header>{{ app_title }}
    <nav style="float:right;font-weight:400;font-size:14px">
      <a href="/mail" style="color:#fff">Mail</a> ·
      <a href="/" style="color:#fff">Invoices</a> ·
      <a href="/approvals/new" style="color:#fff">Approvals</a> ·
      <a href="/expenses/new" style="color:#fff">Expenses</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
