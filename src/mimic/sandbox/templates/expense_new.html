{% extends "expenses_base.html" %}
{% block content %}
<form class="card" method="post" action="/expenses/review" enctype="multipart/form-data">
  <h3>New expense report</h3>
  <label for="employee">Employee</label>
  <input id="employee" name="employee" required>
  <label for="spent_on">Date</label>
  <input id="spent_on" name="spent_on" type="date" required>
  <label for="amount">Amount</label>
  <input id="amount" name="amount" type="number" step="0.01" required>
  <fieldset>
    <legend>Type</legend>
    {% for t in types %}
    <label class="choice"><input type="radio" name="kind" value="{{ t }}" {% if loop.first %}checked{% endif %}> {{ t }}</label>
    {% endfor %}
  </fieldset>
  <label class="choice"><input type="checkbox" id="billable" name="billable" value="yes"> Billable to a client</label>
  <label for="receipt">Receipt</label>
  <input id="receipt" name="receipt" type="file" accept=".pdf,.png,.jpg">
  <button id="next" class="primary" type="submit">Next</button>
</form>
{% endblock %}
